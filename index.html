<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;overflow:hidden;background:white;font-family:Arial}
#score{position:fixed;top:10px;left:10px;font-size:28px}
#game{height:100vh;background:linear-gradient(#fff,#eee)}
#player{position:absolute;bottom:80px;left:90px;font-size:60px}
#block{position:absolute;bottom:80px;right:-80px;width:45px;height:70px;background:#555}
</style>
</head>
<body>
<div id="score">Score: 0</div>
<div id="game"><div id="player">🧍</div><div id="block"></div></div>
<script>
let p=document.getElementById("player"),b=document.getElementById("block"),s=document.getElementById("score");
let y=0,j=false,score=0,speed=4;
function jump(){if(!j){j=true;let t=setInterval(()=>{y+=8;p.style.bottom=(80+y)+"px";if(y>120){clearInterval(t);let d=setInterval(()=>{y-=8;p.style.bottom=(80+y)+"px";if(y<=0){y=0;j=false;clearInterval(d)}},20)}},20)}}
document.body.onclick=jump;
function loop(){let x=parseInt(getComputedStyle(b).right);b.style.right=(x+speed)+"px";
if(x>innerWidth+80){b.style.right="-80px";score++;s.textContent="Score: "+score;speed=Math.min(8,speed+.05)}
let pr=p.getBoundingClientRect(), br=b.getBoundingClientRect();
if(pr.right>br.left&&pr.left<br.right&&pr.bottom>br.top&&pr.top<br.bottom){score=0;speed=4;s.textContent="Score: 0"}
requestAnimationFrame(loop)}
loop();
</script>
</body></html>
